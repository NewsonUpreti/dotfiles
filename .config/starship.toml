# install starship to begin using
# install with shell
# curl -sS https://starship.rs/install.sh | sh

# if in macos, install with homebrew. 
# brew install starship

# configuration for bash
# ~/.bashrc
# eval "$(starship init bash)"

# configuration for zsh
# ~/.zshrc
# eval "$(starship init zsh)"

# configuration for fish
# ~/.config/fish/config.fish
# starship init fish | source


# can use your distro icon in place of  
format = """\
[](bg:#1e1e2e fg:#b4befe)\
[ ](bg:#b4befe fg:#1e1e2e)\
[](fg:#b4befe bg:#1e1e2e)\
$time\
[](fg:#1e1e2e bg:#b4befe)\
$directory\
$git_branch\
$git_status\
[](fg:#94e2d5	 bg:#1e1e2e)\
$character\
"""

[time]
disabled = false
time_format = "%R"
style = "bg:#1e1e2e fg:#cba6f7"
format = "[ 󱑍 $time ]($style)"

[directory]
format = "[  $path ]($style)"
style = "fg:#1e1e2e bg:#b4befe"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "fg:#cba6f7	 bg:#1e1e2e"
format = '[](fg:#b4befe bg:#1e1e2e)[ $symbol $branch ]($style)'

[git_status]
style = "bg:#94e2d5		fg:#1e1e2e"
format = '[ $modified$staged$untracked$conflicted$ahead_behind ]($style)'

# Git status symbols
modified = '$count! '
staged = '$count󰱒 '
untracked = '$count '
conflicted = '$count '
ahead = '$count⇡ '
behind = '$count⇣ '
diverged = '$ahead_count⇕⇡ $behind_count⇣'

[character]
success_symbol = '[ ➜](fg:#b4befe bold)'
error_symbol = '[ ✗](fg:#f38ba8 bold)'
