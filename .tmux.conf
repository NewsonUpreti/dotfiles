# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# run '~/.tmux/plugins/tpm/tpm'

# vim: ft=tmux
set -g mode-style "fg=#cdd6f4,bg=#1e1e2e"

set -g message-style "fg=#cdd6f4,bg=#1e1e2e"
set -g message-command-style "fg=#cdd6f4,bg=#1e1e2e"

set -g pane-border-style "fg=#1e1e2e,bg=default"
set -g pane-active-border-style "fg=#cdd6f4"

set -g status "on"
set -g status-interval 1
set -g status-justify "left"

set -g status-style "fg=#6c7086,bg=#1e1e2e"
set -g status-bg "#181825"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#1e1e2e,bg=#cdd6f4,bold] #S #[fg=#cdd6f4,bg=#89b4fa,nobold,nounderscore,noitalics]#[fg=#11111b,bg=#89b4fa,bold] #(whoami) #[fg=#89b4fa,bg=#181825]"
set -g status-right "#[fg=#6c7086,bg=#181825,nobold,nounderscore,noitalics]#[fg=#89b4fa,bg=#6c7086]#[fg=#a6adc8,bg=#6c7086,nobold,nounderscore,noitalics]#[fg=#89b4fa,bg=#a6adc8]#[fg=#89b4fa,bg=#a6adc8,nobold,nounderscore,noitalics]#[fg=#11111b,bg=#89b4fa,bold] #(hostname) "

setw -g window-status-activity-style "underscore,fg=#bac2de,bg=#181825"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#bac2de,bg=#181825"
setw -g window-status-format '#[fg=#181825,bg=#181825]#[default] #I  #W #[fg=#181825,bg=#181825,nobold,nounderscore,noitalics]'
setw -g window-status-current-format "#[fg=#181825,bg=#cba6f7]#[fg=#1e1e2e,bg=#cba6f7,bold] #I #[fg=#cba6f7,bg=#89b4fa,bold] #[fg=#1e1e2e,bg=#89b4fa,bold]#W #[fg=#89b4fa,bg=#181825,nobold]"

set -g @plugin 'christoomey/vim-tmux-navigator'
run '~/.tmux/plugins/tpm/tpm'
