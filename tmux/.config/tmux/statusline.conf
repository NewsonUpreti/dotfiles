# vim: ft=tmux
set -g mode-style "fg=#cbd5e1,bg=#0b1220"

set -g message-style "fg=#cbd5e1,bg=#0b1220"
set -g message-command-style "fg=#cbd5e1,bg=#0b1220"

set -g pane-border-style "fg=#1f2a44"
set -g pane-active-border-style "fg=#93c5fd"

set -g status "on"
set -g status-interval 1
set -g status-justify "left"

set -g status-style "fg=#94a3b8,bg=#0b1220"

set -g status-bg "#0b1220"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#64748b,bg=#1f2a44,bold] #S:#I.#P #[fg=#cbd5e1,bg=#1f2a44,nobold,nounderscore,noitalics]#[fg=#0b1220,bg=#93c5fd,bold] #(whoami) #[fg=#93c5fd,bg=#0b1220]"

set -g status-right "#[fg=#334155,bg=#0b1220,nobold,nounderscore,noitalics]#[fg=#64748b,bg=#334155]#[fg=#94a3b8,bg=#334155,nobold,nounderscore,noitalics]#[fg=#cbd5e1,bg=#64748b]#[fg=#cbd5e1,bg=#64748b,nobold,nounderscore,noitalics]#[fg=#0b1220,bg=#93c5fd,bold] #h "

setw -g window-status-activity-style "underscore,fg=#64748b,bg=#0b1220"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#64748b,bg=#0b1220"

setw -g window-status-format '#[fg=#0b1220,bg=#0b1220]#[default] #I  #{b:pane_current_path} #[fg=#0b1220,bg=#0b1220,nobold,nounderscore,noitalics]'

setw -g window-status-current-format '#[fg=#0b1220,bg=#1f2a44]#[fg=#93c5fd,bg=#1f2a44] #I #[fg=#1f2a44,bg=#93c5fd] #{b:pane_current_path} #[fg=#93c5fd,bg=#0b1220,nobold]'
